<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="سایت شخصی یاسین، آپاراتر و گیمر. لینک کانال‌ها و آخرین ویدیوها را اینجا ببینید.">
    <title>سایت Yasin10</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            color: #2c3e50;
            background: linear-gradient(270deg, #74b9ff, #a29bfe, #ffeaa7, #fab1a0);
            background-size: 800% 800%;
            animation: gradientMove 15s ease infinite;
            overflow-x: hidden;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        header {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255,255,255,0.3);
            position: relative;
        }
        h1 {
            font-size: 28px;
            animation: textColorChange 2s infinite alternate;
        }
        @keyframes textColorChange {
            0% { color: black; }
            100% { color: saddlebrown; }
        }
        #typed-text {
            font-size: 18px;
            color: #f5f5f5;
            margin-top: 10px;
            min-height: 24px;
        }
        #clock {
            font-size: 16px;
            color: #fff;
            margin-top: 5px;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background-color: #0984e3;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        a:hover {
            background-color: #0652dd;
            transform: scale(1.05);
        }
        .support-btn {
            background-color: #e84393;
            animation: pulse 1.5s infinite;
        }
        .support-btn:hover {
            background-color: #d63072;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 67, 147, 0.7);}
            70% { transform: scale(1.1); box-shadow: 0 0 20px 10px rgba(232, 67, 147, 0);}
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 67, 147, 0);}
        }
        section {
            margin: 40px auto;
            max-width: 700px;
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        section.visible {
            opacity: 1;
            transform: translateY(0);
        }
        /* افکت برف */
        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 9999;
            user-select: none;
            pointer-events: none;
            color: white;
            font-size: 1em;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>

<header>
    <h1>سلام! من یاسینم 😄</h1>
    <p id="typed-text"></p>
    <div id="clock"></div>
</header>

<section>
    <h2>لینک‌های من 📌</h2>
    <a href="https://rubika.ir/yasin10gng" target="_blank">کانال روبیکا</a>
    <a href="https://www.aparat.com/yasin10gang" target="_blank">کانال آپارات</a>
    <a href="https://reymit.ir/yasingng10" target="_blank" class="support-btn">حمایت مالی ♥</a>
</section>

<section>
    <h2>اشتراک‌گذاری سایت 📢</h2>
    <button id="shareBtn" style="padding: 12px 24px; background: #00cec9; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer;">
        اشتراک‌گذاری سریع
    </button>
    <div id="shareLinks" style="display:none; margin-top: 15px;">
        <a href="https://t.me/share/url?url=https://mysite.com" target="_blank">تلگرام</a>
        <a href="https://wa.me/?text=https://mysite.com" target="_blank">واتساپ</a>
        <a href="https://rubika.ir/joingroup/join?link=https://mysite.com" target="_blank">روبیکا</a>
    </div>
</section>

<section>
    <h2>یکی از ویدیو های آپارات</h2>
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
       <iframe src="https://www.aparat.com/video/video/embed/videohash/swnwt8t/vt/frame" 
        allowfullscreen
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;">
       </iframe>
    </div>
</section>

<section>
    <h2>ارتباط با من 📬</h2>
    <p>برای چت مستقیم با من در روبیکا روی دکمه زیر بزنید:</p>
    <a href="https://rubika.ir/yasin10gang?msg=سلام%20یاسین!%20میخواستم%20با%20هات%20در%20ارتباط%20باشم." target="_blank">
        ارسال پیام در روبیکا
    </a>
</section>

<script>
    // افکت تایپ
    const text = "این اولین سایت شخصی من هست. من یک آپاراتر و گیمر هستم 🎮";
    let index = 0;
    function typeEffect() {
        if (index < text.length) {
            document.getElementById("typed-text").innerHTML += text.charAt(index);
            index++;
            setTimeout(typeEffect, 70);
        }
    }
    window.onload = typeEffect;

    // نمایش بخش‌ها هنگام اسکرول
    const sections = document.querySelectorAll('section');
    function checkSections() {
        const triggerBottom = window.innerHeight * 0.85;
        sections.forEach(section => {
            const sectionTop = section.getBoundingClientRect().top;
            if (sectionTop < triggerBottom) {
                section.classList.add('visible');
            }
        });
    }
    window.addEventListener('scroll', checkSections);
    window.addEventListener('load', checkSections);

    // اشتراک‌گذاری
    document.getElementById("shareBtn").addEventListener("click", function() {
        if (navigator.share) {
            navigator.share({
                title: "سایت Yasin10",
                text: "سایت yasin10!",
                url: window.location.href
            }).catch(err => console.log("Share failed:", err));
        } else {
            document.getElementById("shareLinks").style.display = "block";
        }
    });

    // ساعت و تاریخ
    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const date = now.toLocaleDateString('fa-IR', options);
        const time = now.toLocaleTimeString('fa-IR');
        document.getElementById('clock').innerHTML = date + " - " + time;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // افکت برف
    const snowCount = 50;
    for(let i=0; i<snowCount; i++){
        const snow = document.createElement('div');
        snow.className = 'snowflake';
        snow.style.left = Math.random() * window.innerWidth + 'px';
        snow.style.fontSize = (Math.random()*10 + 10) + 'px';
        snow.style.animationDuration = (Math.random()*10 + 10) + 's';
        snow.style.opacity = Math.random();
        snow.innerHTML = '❄';
        document.body.appendChild(snow);
    }
</script>

</body>
</html>
